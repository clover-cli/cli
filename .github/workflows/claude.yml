name: Claude PR Chat & Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-interactive:
    # Run only if someone mentions @claude in an open PR comment
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Leaving 'prompt' blank tells the action to operate in interactive mode, 
          # reading the user's @claude comment text directly as its instructions.
          claude_args: --comment
