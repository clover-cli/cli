name: Publish

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test

      - name: Publish if the version isn't on npm yet
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "@clover-cli/cli@$version" version)" = "$version" ]; then
            echo "$version is already published."
          else
            npm publish
          fi
